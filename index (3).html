<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sim Handicaps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f1a14;
      color: #e8ede9;
      font-family: Georgia, serif;
      padding-bottom: 48px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 16px;
      border-bottom: 1px solid #1e3028;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo { font-size: 28px; }
    .app-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .app-sub { font-size: 12px; color: #6a9b7e; margin-top: 2px; }

    /* ── Leaderboard ── */
    #leaderboard {
      background: #141f18;
      border-bottom: 1px solid #1e3028;
      padding: 12px 20px;
      display: none;
    }
    .leader-label {
      font-size: 11px;
      color: #6a9b7e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .leader-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
    .leader-rank { font-size: 12px; color: #6a9b7e; width: 16px; }
    .leader-name { font-size: 14px; flex: 1; }
    .leader-hcp { font-size: 14px; font-weight: 700; color: #b8d4bf; }

    /* ── Card Grid ── */
    #card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      padding: 20px;
    }
    .empty-msg {
      grid-column: 1/-1;
      text-align: center;
      color: #6a9b7e;
      padding: 60px 0;
      font-size: 15px;
    }

    /* ── Player Card ── */
    .card {
      background: #141f18;
      border: 1px solid #1e3028;
      border-radius: 12px;
      padding: 20px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .player-name { font-size: 18px; font-weight: 700; }
    .round-count { font-size: 12px; color: #6a9b7e; margin-top: 2px; }
    .hcp-block { text-align: right; }
    .hcp-number { font-size: 32px; font-weight: 700; color: #b8d4bf; line-height: 1; }
    .hcp-label { font-size: 11px; color: #6a9b7e; text-transform: uppercase; letter-spacing: 0.8px; }
    .trend { font-size: 12px; margin-top: 2px; }
    .last-round { font-size: 13px; color: #a0baa8; margin-bottom: 12px; }
    .last-date { color: #6a9b7e; }

    /* ── Mini Chart ── */
    .mini-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 52px;
      margin-bottom: 14px;
    }
    .bar-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .bar { width: 100%; border-radius: 2px; }
    .bar-label { font-size: 9px; color: #6a9b7e; margin-top: 2px; }

    /* ── Card Actions ── */
    .card-actions { display: flex; gap: 8px; margin-top: 4px; }
    .btn-add-round {
      flex: 1;
      background: #2e7d52;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-remove {
      background: transparent;
      color: #6a9b7e;
      border: 1px solid #1e3028;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-history {
      background: transparent;
      color: #6a9b7e;
      border: 1px solid #1e3028;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── Primary Button ── */
    .btn-primary {
      background: #2e7d52;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      margin-top: 8px;
    }
    .btn-primary-sm {
      background: #2e7d52;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── Modal ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: #141f18;
      border: 1px solid #1e3028;
      border-radius: 14px;
      width: 340px;
      max-width: 92vw;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 12px;
      border-bottom: 1px solid #1e3028;
    }
    .modal-title { font-size: 16px; font-weight: 700; }
    .btn-close {
      background: none;
      border: none;
      color: #6a9b7e;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; color: #6a9b7e; }
    input[type="text"], input[type="number"], input[type="date"] {
      background: #0f1a14;
      border: 1px solid #2a3f30;
      border-radius: 8px;
      color: #e8ede9;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      width: 100%;
    }
    .hint { font-size: 11px; color: #6a9b7e; }
    .diff-preview {
      background: #0f1a14;
      border: 1px solid #2a3f30;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: #b8d4bf;
      text-align: center;
    }

    /* ── History Table ── */
    .history-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    .history-table th {
      color: #6a9b7e;
      text-align: left;
      padding: 4px 8px;
      font-weight: normal;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .history-table td { padding: 6px 8px; border-top: 1px solid #1e3028; }
    .history-scroll { max-height: 260px; overflow-y: auto; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-left">
    <div class="logo">⛳</div>
    <div>
      <div class="app-title">Sim Handicaps</div>
      <div class="app-sub">Simulator · Par 72</div>
    </div>
  </div>
  <button class="btn-primary-sm" onclick="openAddPlayer()">+ Player</button>
</header>

<!-- Leaderboard -->
<div id="leaderboard">
  <div class="leader-label">Leaderboard</div>
  <div id="leader-rows"></div>
</div>

<!-- Cards -->
<div id="card-grid">
  <div class="empty-msg">No players yet. Add someone to start tracking.</div>
</div>

<!-- ── Add Player Modal ── -->
<div id="modal-add-player" class="overlay" style="display:none" onclick="closeModal('modal-add-player')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">Add Player</span>
      <button class="btn-close" onclick="closeModal('modal-add-player')">✕</button>
    </div>
    <div class="modal-body">
      <label>Name</label>
      <input type="text" id="new-name" placeholder="Player name" />
      <label>Starting Handicap</label>
      <input type="number" id="new-hcp" placeholder="e.g. 12 or -2" step="0.1" />
      <div class="hint">Positive = strokes over par &nbsp;·&nbsp; Negative = scratch / plus</div>
      <button class="btn-primary" onclick="addPlayer()">Add Player</button>
    </div>
  </div>
</div>

<!-- ── Add Round Modal ── -->
<div id="modal-add-round" class="overlay" style="display:none" onclick="closeModal('modal-add-round')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="round-modal-title">Add Round</span>
      <button class="btn-close" onclick="closeModal('modal-add-round')">✕</button>
    </div>
    <div class="modal-body">
      <label>Score (gross strokes)</label>
      <input type="number" id="round-score" placeholder="e.g. 78" min="40" max="150"
             oninput="updateDiffPreview()" />
      <div class="hint">Par is 72 · enter your total strokes</div>
      <div id="diff-preview" class="diff-preview" style="display:none"></div>
      <label>Date</label>
      <input type="date" id="round-date" />
      <button class="btn-primary" onclick="saveRound()">Save Round</button>
    </div>
  </div>
</div>

<!-- ── History Modal ── -->
<div id="modal-history" class="overlay" style="display:none" onclick="closeModal('modal-history')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="history-modal-title">Round History</span>
      <button class="btn-close" onclick="closeModal('modal-history')">✕</button>
    </div>
    <div class="modal-body">
      <div class="history-scroll">
        <table class="history-table">
          <thead><tr><th>#</th><th>Date</th><th>Score</th><th>+/-</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const PAR = 72;
  const STORAGE_KEY = 'sim-golf-handicap-players';
  let players = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let activePlayerId = null;

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
  }

  function calcHandicap(rounds) {
    if (!rounds.length) return null;
    const last20 = rounds.slice(-20);
    const diffs = last20.map(r => r.score - PAR).sort((a, b) => a - b);
    const count = Math.min(diffs.length, 8);
    const best = diffs.slice(0, count);
    const avg = best.reduce((s, d) => s + d, 0) / best.length;
    return Math.round(avg * 10) / 10;
  }

  function fmtHcp(val) {
    return val >= 0 ? '+' + val : String(val);
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  // ── Modals ──────────────────────────────────────────────────────────────
  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function openAddPlayer() {
    document.getElementById('new-name').value = '';
    document.getElementById('new-hcp').value = '';
    openModal('modal-add-player');
    setTimeout(() => document.getElementById('new-name').focus(), 50);
  }

  function openAddRound(playerId) {
    activePlayerId = playerId;
    const p = players.find(p => p.id === playerId);
    document.getElementById('round-modal-title').textContent = 'Add Round — ' + p.name;
    document.getElementById('round-score').value = '';
    document.getElementById('round-date').value = today();
    document.getElementById('diff-preview').style.display = 'none';
    openModal('modal-add-round');
    setTimeout(() => document.getElementById('round-score').focus(), 50);
  }

  function openHistory(playerId) {
    const p = players.find(p => p.id === playerId);
    document.getElementById('history-modal-title').textContent = p.name + ' — History';
    const tbody = document.getElementById('history-body');
    tbody.innerHTML = '';
    if (!p.rounds.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="color:#6a9b7e;text-align:center;padding:16px">No rounds yet</td></tr>';
    } else {
      [...p.rounds].reverse().forEach((r, i) => {
        const diff = r.score - PAR;
        const color = diff <= 0 ? '#4caf84' : '#e07070';
        tbody.innerHTML += `<tr>
          <td style="color:#6a9b7e">${p.rounds.length - i}</td>
          <td>${r.date}</td>
          <td><strong>${r.score}</strong></td>
          <td style="color:${color}">${diff >= 0 ? '+' : ''}${diff}</td>
        </tr>`;
      });
    }
    openModal('modal-history');
  }

  function updateDiffPreview() {
    const score = parseInt(document.getElementById('round-score').value);
    const el = document.getElementById('diff-preview');
    if (!isNaN(score) && score >= 40 && score <= 150) {
      const diff = score - PAR;
      el.style.display = 'block';
      el.textContent = 'Differential: ' + (diff >= 0 ? '+' : '') + diff;
    } else {
      el.style.display = 'none';
    }
  }

  // ── CRUD ────────────────────────────────────────────────────────────────
  function addPlayer() {
    const name = document.getElementById('new-name').value.trim();
    const hcp = parseFloat(document.getElementById('new-hcp').value);
    if (!name || isNaN(hcp)) { alert('Please fill in both fields.'); return; }
    players.push({ id: Date.now(), name, startingHandicap: hcp, rounds: [] });
    save();
    closeModal('modal-add-player');
    render();
  }

  function saveRound() {
    const score = parseInt(document.getElementById('round-score').value);
    const date = document.getElementById('round-date').value;
    if (isNaN(score) || score < 40 || score > 150) { alert('Enter a valid score (40–150).'); return; }
    const p = players.find(p => p.id === activePlayerId);
    p.rounds.push({ score, date });
    save();
    closeModal('modal-add-round');
    render();
  }

  function removePlayer(id) {
    if (!confirm('Remove this player?')) return;
    players = players.filter(p => p.id !== id);
    save();
    render();
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function render() {
    renderCards();
    renderLeaderboard();
  }

  function renderLeaderboard() {
    const lb = document.getElementById('leaderboard');
    if (players.length < 2) { lb.style.display = 'none'; return; }
    lb.style.display = 'block';
    const sorted = [...players].sort((a, b) => {
      const ha = calcHandicap(a.rounds) ?? a.startingHandicap;
      const hb = calcHandicap(b.rounds) ?? b.startingHandicap;
      return ha - hb;
    });
    document.getElementById('leader-rows').innerHTML = sorted.map((p, i) => {
      const hcp = calcHandicap(p.rounds) ?? p.startingHandicap;
      return `<div class="leader-row">
        <span class="leader-rank">${i + 1}</span>
        <span class="leader-name">${p.name}</span>
        <span class="leader-hcp">${fmtHcp(hcp)}</span>
      </div>`;
    }).join('');
  }

  function renderCards() {
    const grid = document.getElementById('card-grid');
    if (!players.length) {
      grid.innerHTML = '<div class="empty-msg">No players yet. Add someone to start tracking.</div>';
      return;
    }
    grid.innerHTML = players.map(p => {
      const hcp = calcHandicap(p.rounds) ?? p.startingHandicap;
      const lastRound = p.rounds[p.rounds.length - 1];

      // Trend
      let trendHtml = '';
      if (p.rounds.length >= 2) {
        const prev = calcHandicap(p.rounds.slice(0, -1));
        const trend = Math.round((hcp - prev) * 10) / 10;
        const color = trend <= 0 ? '#4caf84' : '#e07070';
        trendHtml = `<div class="trend" style="color:${color}">${trend <= 0 ? '▼' : '▲'} ${Math.abs(trend)}</div>`;
      }

      // Last round
      let lastHtml = '';
      if (lastRound) {
        const diff = lastRound.score - PAR;
        const color = diff <= 0 ? '#4caf84' : '#e07070';
        lastHtml = `<div class="last-round">
          Last round: <strong>${lastRound.score}</strong>
          <span class="last-date"> · ${lastRound.date}</span>
          <span style="color:${color};margin-left:6px">(${diff >= 0 ? '+' : ''}${diff})</span>
        </div>`;
      }

      // Mini chart
      let chartHtml = '';
      if (p.rounds.length > 1) {
        const recent = p.rounds.slice(-8);
        const bars = recent.map(r => {
          const diff = r.score - PAR;
          const norm = Math.min(Math.max((diff + 20) / 40, 0), 1);
          const h = Math.round(norm * 40) + 4;
          const bg = diff <= 0 ? '#4caf84' : '#7b9fd4';
          return `<div class="bar-wrap">
            <div class="bar" style="height:${h}px;background:${bg}"></div>
            <div class="bar-label">${r.score}</div>
          </div>`;
        }).join('');
        chartHtml = `<div class="mini-chart">${bars}</div>`;
      }

      return `<div class="card">
        <div class="card-top">
          <div>
            <div class="player-name">${p.name}</div>
            <div class="round-count">${p.rounds.length} round${p.rounds.length !== 1 ? 's' : ''} logged</div>
          </div>
          <div class="hcp-block">
            <div class="hcp-number">${fmtHcp(hcp)}</div>
            <div class="hcp-label">handicap</div>
            ${trendHtml}
          </div>
        </div>
        ${lastHtml}
        ${chartHtml}
        <div class="card-actions">
          <button class="btn-add-round" onclick="openAddRound(${p.id})">+ Add Round</button>
          <button class="btn-history" onclick="openHistory(${p.id})">History</button>
          <button class="btn-remove" onclick="removePlayer(${p.id})">✕</button>
        </div>
      </div>`;
    }).join('');
  }

  // ── Enter key support ────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('modal-add-player').style.display !== 'none') addPlayer();
      if (document.getElementById('modal-add-round').style.display !== 'none') saveRound();
    }
    if (e.key === 'Escape') {
      ['modal-add-player','modal-add-round','modal-history'].forEach(closeModal);
    }
  });

  render();
</script>
</body>
</html>
