<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sim Handicaps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f1a14;
      color: #e8ede9;
      font-family: Georgia, serif;
      padding-bottom: 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 16px;
      border-bottom: 1px solid #1e3028;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo { font-size: 28px; }
    .app-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .app-sub { font-size: 12px; color: #6a9b7e; margin-top: 2px; }

    #status-bar {
      text-align: center;
      font-size: 12px;
      padding: 6px;
      display: none;
    }
    #status-bar.loading { display: block; background: #1a2e20; color: #6a9b7e; }
    #status-bar.error   { display: block; background: #2e1a1a; color: #e07070; }

    #leaderboard {
      background: #141f18;
      border-bottom: 1px solid #1e3028;
      padding: 12px 20px;
      display: none;
    }
    .leader-label {
      font-size: 11px;
      color: #6a9b7e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .leader-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
    .leader-rank { font-size: 12px; color: #6a9b7e; width: 16px; }
    .leader-name { font-size: 14px; flex: 1; }
    .leader-hcp { font-size: 14px; font-weight: 700; color: #b8d4bf; }

    #card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      padding: 20px;
    }
    .empty-msg {
      grid-column: 1/-1;
      text-align: center;
      color: #6a9b7e;
      padding: 60px 0;
      font-size: 15px;
    }

    .card {
      background: #141f18;
      border: 1px solid #1e3028;
      border-radius: 12px;
      padding: 20px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .player-name { font-size: 18px; font-weight: 700; }
    .round-count { font-size: 12px; color: #6a9b7e; margin-top: 2px; }
    .hcp-block { text-align: right; }
    .hcp-number { font-size: 32px; font-weight: 700; color: #b8d4bf; line-height: 1; }
    .hcp-label { font-size: 11px; color: #6a9b7e; text-transform: uppercase; letter-spacing: 0.8px; }
    .hcp-note  { font-size: 11px; color: #6a9b7e; margin-top: 3px; }
    .trend { font-size: 12px; margin-top: 2px; }
    .last-round { font-size: 13px; color: #a0baa8; margin-bottom: 12px; }
    .last-date { color: #6a9b7e; }

    .mini-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 52px;
      margin-bottom: 14px;
    }
    .bar-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .bar { width: 100%; border-radius: 2px; }
    .bar-label { font-size: 9px; color: #6a9b7e; margin-top: 2px; }

    .card-actions { display: flex; gap: 8px; margin-top: 4px; }
    .btn-add-round {
      flex: 1;
      background: #2e7d52;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-secondary {
      background: transparent;
      color: #6a9b7e;
      border: 1px solid #1e3028;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary {
      background: #2e7d52;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      margin-top: 8px;
    }
    .btn-primary-sm {
      background: #2e7d52;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: #141f18;
      border: 1px solid #1e3028;
      border-radius: 14px;
      width: 360px;
      max-width: 92vw;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 12px;
      border-bottom: 1px solid #1e3028;
    }
    .modal-title { font-size: 16px; font-weight: 700; }
    .btn-close {
      background: none;
      border: none;
      color: #6a9b7e;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; color: #6a9b7e; }
    input[type="text"], input[type="number"], input[type="date"] {
      background: #0f1a14;
      border: 1px solid #2a3f30;
      border-radius: 8px;
      color: #e8ede9;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      width: 100%;
    }
    .hint { font-size: 11px; color: #6a9b7e; }
    .diff-preview {
      background: #0f1a14;
      border: 1px solid #2a3f30;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: #b8d4bf;
      text-align: center;
    }

    .history-scroll { max-height: 300px; overflow-y: auto; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .history-table th {
      color: #6a9b7e;
      text-align: left;
      padding: 4px 8px;
      font-weight: normal;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .history-table td { padding: 7px 8px; border-top: 1px solid #1e3028; vertical-align: middle; }
    .btn-del-round {
      background: none;
      border: none;
      color: #6a9b7e;
      cursor: pointer;
      font-size: 15px;
      padding: 0 4px;
      line-height: 1;
    }
    .btn-del-round:hover { color: #e07070; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">⛳</div>
    <div>
      <div class="app-title">Sim Handicaps</div>
      <div class="app-sub">Simulator · Par 72</div>
    </div>
  </div>
  <button class="btn-primary-sm" onclick="openAddPlayer()">+ Player</button>
</header>

<div id="status-bar">Loading players…</div>

<div id="leaderboard">
  <div class="leader-label">Leaderboard</div>
  <div id="leader-rows"></div>
</div>

<div id="card-grid">
  <div class="empty-msg">Loading…</div>
</div>

<!-- Add Player Modal -->
<div id="modal-add-player" class="overlay" style="display:none" onclick="closeModal('modal-add-player')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">Add Player</span>
      <button class="btn-close" onclick="closeModal('modal-add-player')">✕</button>
    </div>
    <div class="modal-body">
      <label>Name</label>
      <input type="text" id="new-name" placeholder="Player name" />
      <label>Starting Handicap</label>
      <input type="number" id="new-hcp" placeholder="e.g. 12 or -2" step="0.1" />
      <div class="hint">This seeds the calculation until enough rounds are recorded.</div>
      <button class="btn-primary" onclick="addPlayer()">Add Player</button>
    </div>
  </div>
</div>

<!-- Add Round Modal -->
<div id="modal-add-round" class="overlay" style="display:none" onclick="closeModal('modal-add-round')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="round-modal-title">Add Round</span>
      <button class="btn-close" onclick="closeModal('modal-add-round')">✕</button>
    </div>
    <div class="modal-body">
      <label>Score (gross strokes)</label>
      <input type="number" id="round-score" placeholder="e.g. 78" min="40" max="150" oninput="updateDiffPreview()" />
      <div class="hint">Par is 72 · enter your total strokes</div>
      <div id="diff-preview" class="diff-preview" style="display:none"></div>
      <label>Date</label>
      <input type="date" id="round-date" />
      <button class="btn-primary" onclick="saveRound()">Save Round</button>
    </div>
  </div>
</div>

<!-- History Modal -->
<div id="modal-history" class="overlay" style="display:none" onclick="closeModal('modal-history')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="history-modal-title">Round History</span>
      <button class="btn-close" onclick="closeModal('modal-history')">✕</button>
    </div>
    <div class="modal-body">
      <div class="history-scroll">
        <table class="history-table">
          <thead><tr><th>#</th><th>Date</th><th>Score</th><th>+/−</th><th></th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDKs (modular, CDN) -->
<script type="module">
  import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc,
           onSnapshot, addDoc, updateDoc,
           deleteDoc, query, orderBy }              from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── Firebase init ────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey:            "AIzaSyCCZm0ZPEtE-LDmQjSiys9qfePoQBAoswM",
    authDomain:        "indoor-f4fb9.firebaseapp.com",
    projectId:         "indoor-f4fb9",
    storageBucket:     "indoor-f4fb9.firebasestorage.app",
    messagingSenderId: "957445852638",
    appId:             "1:957445852638:web:4f0554996d7e345427614f"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const playersCol = collection(db, "players");

  // ── State ────────────────────────────────────────────────────────────────
  let players = [];          // live array kept in sync by onSnapshot
  let activePlayerId = null; // Firestore doc id

  const PAR = 72;

  // ── Handicap logic ───────────────────────────────────────────────────────
  function calcHandicap(player) {
    const seedScore = PAR + player.startingHandicap;
    const allRounds = [{ score: seedScore }, ...(player.rounds || [])];
    const last20    = allRounds.slice(-20);
    const diffs     = last20.map(r => r.score - PAR).sort((a, b) => a - b);
    const count     = Math.min(diffs.length, 8);
    const best      = diffs.slice(0, count);
    const avg       = best.reduce((s, d) => s + d, 0) / best.length;
    return Math.round(avg * 10) / 10;
  }

  function fmtHcp(val) {
    // Golf convention: plus = better than scratch (under par)
    return val < 0 ? '+' + Math.abs(val) : String(val);
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  // ── Status bar ───────────────────────────────────────────────────────────
  function setStatus(msg, type) {
    const bar = document.getElementById('status-bar');
    bar.className = type || '';
    bar.textContent = msg;
  }

  // ── Modals ───────────────────────────────────────────────────────────────
  window.openModal  = id => document.getElementById(id).style.display = 'flex';
  window.closeModal = id => document.getElementById(id).style.display = 'none';

  window.openAddPlayer = () => {
    document.getElementById('new-name').value = '';
    document.getElementById('new-hcp').value  = '';
    openModal('modal-add-player');
    setTimeout(() => document.getElementById('new-name').focus(), 50);
  };

  window.openAddRound = playerId => {
    activePlayerId = playerId;
    const p = players.find(p => p.id === playerId);
    document.getElementById('round-modal-title').textContent = 'Add Round — ' + p.name;
    document.getElementById('round-score').value = '';
    document.getElementById('round-date').value  = today();
    document.getElementById('diff-preview').style.display = 'none';
    openModal('modal-add-round');
    setTimeout(() => document.getElementById('round-score').focus(), 50);
  };

  window.openHistory = playerId => {
    activePlayerId = playerId;
    renderHistory();
    openModal('modal-history');
  };

  window.updateDiffPreview = () => {
    const score = parseInt(document.getElementById('round-score').value);
    const el    = document.getElementById('diff-preview');
    if (!isNaN(score) && score >= 40 && score <= 150) {
      const diff = score - PAR;
      el.style.display = 'block';
      el.textContent   = 'Differential: ' + (diff >= 0 ? '+' : '') + diff;
    } else {
      el.style.display = 'none';
    }
  };

  // ── CRUD ─────────────────────────────────────────────────────────────────
  window.addPlayer = async () => {
    const name = document.getElementById('new-name').value.trim();
    const hcp  = parseFloat(document.getElementById('new-hcp').value);
    if (!name || isNaN(hcp)) { alert('Please fill in both fields.'); return; }
    try {
      await addDoc(playersCol, { name, startingHandicap: hcp, rounds: [] });
      closeModal('modal-add-player');
    } catch (e) {
      alert('Error saving player: ' + e.message);
    }
  };

  window.saveRound = async () => {
    const score = parseInt(document.getElementById('round-score').value);
    const date  = document.getElementById('round-date').value;
    if (isNaN(score) || score < 40 || score > 150) { alert('Enter a valid score (40–150).'); return; }
    const p = players.find(p => p.id === activePlayerId);
    const updatedRounds = [...(p.rounds || []), { score, date }];
    try {
      await updateDoc(doc(db, 'players', activePlayerId), { rounds: updatedRounds });
      closeModal('modal-add-round');
    } catch (e) {
      alert('Error saving round: ' + e.message);
    }
  };

  window.deleteRound = async idx => {
    if (!confirm('Delete this round?')) return;
    const p = players.find(p => p.id === activePlayerId);
    const updatedRounds = [...(p.rounds || [])];
    updatedRounds.splice(idx, 1);
    try {
      await updateDoc(doc(db, 'players', activePlayerId), { rounds: updatedRounds });
      renderHistory(); // refresh open modal
    } catch (e) {
      alert('Error deleting round: ' + e.message);
    }
  };

  window.removePlayer = async id => {
    if (!confirm('Remove this player and all their rounds?')) return;
    try {
      await deleteDoc(doc(db, 'players', id));
    } catch (e) {
      alert('Error removing player: ' + e.message);
    }
  };

  // ── History modal render ──────────────────────────────────────────────────
  function renderHistory() {
    const p = players.find(p => p.id === activePlayerId);
    document.getElementById('history-modal-title').textContent = p.name + ' — History';
    const tbody = document.getElementById('history-body');
    tbody.innerHTML = '';
    if (!p.rounds || !p.rounds.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="color:#6a9b7e;text-align:center;padding:16px">No rounds yet</td></tr>';
      return;
    }
    [...p.rounds].reverse().forEach((r, revIdx) => {
      const origIdx = p.rounds.length - 1 - revIdx;
      const diff    = r.score - PAR;
      const color   = diff <= 0 ? '#4caf84' : '#e07070';
      tbody.innerHTML += `<tr>
        <td style="color:#6a9b7e">${origIdx + 1}</td>
        <td>${r.date}</td>
        <td><strong>${r.score}</strong></td>
        <td style="color:${color}">${diff >= 0 ? '+' : ''}${diff}</td>
        <td><button class="btn-del-round" onclick="deleteRound(${origIdx})" title="Delete">🗑</button></td>
      </tr>`;
    });
  }

  // ── Render cards ──────────────────────────────────────────────────────────
  function render() {
    renderCards();
    renderLeaderboard();
  }

  function renderLeaderboard() {
    const lb = document.getElementById('leaderboard');
    if (players.length < 2) { lb.style.display = 'none'; return; }
    lb.style.display = 'block';
    const sorted = [...players].sort((a, b) => calcHandicap(a) - calcHandicap(b));
    document.getElementById('leader-rows').innerHTML = sorted.map((p, i) => `
      <div class="leader-row">
        <span class="leader-rank">${i + 1}</span>
        <span class="leader-name">${p.name}</span>
        <span class="leader-hcp">${fmtHcp(calcHandicap(p))}</span>
      </div>`).join('');
  }

  function renderCards() {
    const grid = document.getElementById('card-grid');
    if (!players.length) {
      grid.innerHTML = '<div class="empty-msg">No players yet. Add someone to start tracking.</div>';
      return;
    }
    grid.innerHTML = players.map(p => {
      const hcp       = calcHandicap(p);
      const rounds    = p.rounds || [];
      const lastRound = rounds[rounds.length - 1];

      // Trend
      let trendHtml = '';
      if (rounds.length >= 1) {
        const prev  = calcHandicap({ ...p, rounds: rounds.slice(0, -1) });
        const trend = Math.round((hcp - prev) * 10) / 10;
        const color = trend <= 0 ? '#4caf84' : '#e07070';
        trendHtml   = `<div class="trend" style="color:${color}">${trend <= 0 ? '▼' : '▲'} ${Math.abs(trend)}</div>`;
      }

      const noteText = rounds.length === 0
        ? 'Starting handicap'
        : `Based on ${rounds.length} round${rounds.length > 1 ? 's' : ''} + seed`;

      // Last round
      let lastHtml = '';
      if (lastRound) {
        const diff  = lastRound.score - PAR;
        const color = diff <= 0 ? '#4caf84' : '#e07070';
        lastHtml    = `<div class="last-round">
          Last: <strong>${lastRound.score}</strong>
          <span class="last-date"> · ${lastRound.date}</span>
          <span style="color:${color};margin-left:6px">(${diff >= 0 ? '+' : ''}${diff})</span>
        </div>`;
      }

      // Mini chart
      let chartHtml = '';
      if (rounds.length > 0) {
        const recent = rounds.slice(-8);
        const bars   = recent.map(r => {
          const diff = r.score - PAR;
          const norm = Math.min(Math.max((diff + 20) / 40, 0), 1);
          const h    = Math.round(norm * 40) + 4;
          const bg   = diff <= 0 ? '#4caf84' : '#7b9fd4';
          return `<div class="bar-wrap">
            <div class="bar" style="height:${h}px;background:${bg}"></div>
            <div class="bar-label">${r.score}</div>
          </div>`;
        }).join('');
        chartHtml = `<div class="mini-chart">${bars}</div>`;
      }

      return `<div class="card">
        <div class="card-top">
          <div>
            <div class="player-name">${p.name}</div>
            <div class="round-count">${rounds.length} round${rounds.length !== 1 ? 's' : ''} logged</div>
          </div>
          <div class="hcp-block">
            <div class="hcp-number">${fmtHcp(hcp)}</div>
            <div class="hcp-label">handicap</div>
            <div class="hcp-note">${noteText}</div>
            ${trendHtml}
          </div>
        </div>
        ${lastHtml}
        ${chartHtml}
        <div class="card-actions">
          <button class="btn-add-round" onclick="openAddRound('${p.id}')">+ Add Round</button>
          <button class="btn-secondary" onclick="openHistory('${p.id}')">History</button>
          <button class="btn-secondary" onclick="removePlayer('${p.id}')">✕</button>
        </div>
      </div>`;
    }).join('');
  }

  // ── Live listener ─────────────────────────────────────────────────────────
  setStatus('Loading players…', 'loading');

  onSnapshot(playersCol, snapshot => {
    players = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    setStatus('', '');
    render();
    // If history modal is open, keep it fresh
    if (activePlayerId && document.getElementById('modal-history').style.display !== 'none') {
      renderHistory();
    }
  }, err => {
    setStatus('Firebase error: ' + err.message, 'error');
  });

  // ── Keyboard shortcuts ────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('modal-add-player').style.display !== 'none') addPlayer();
      if (document.getElementById('modal-add-round').style.display  !== 'none') saveRound();
    }
    if (e.key === 'Escape') {
      ['modal-add-player','modal-add-round','modal-history'].forEach(closeModal);
    }
  });
</script>
</body>
</html>
